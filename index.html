<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIVA</title>
</head>
<body>
  <div id="app">
    <div id="avatarStage" title="双击 NIVA 打开控制界面">
      <canvas id="nivaCanvas"></canvas>
      <div id="speechBubble" class="speech-bubble hidden"></div>
      <div id="statusDot" class="status-dot" title="NIVA 状态"></div>
    </div>
    <aside id="panel" class="panel hidden" aria-hidden="true">
      <div class="panel-head">
        <div>
          <strong>NIVA</strong>
          <small>V0.83 · Safe Pose Planner</small>
        </div>
        <button id="closePanel" class="icon-btn">×</button>
      </div>
      <div class="status-line"><span id="modeBadge">体验模式</span><span id="plannerBadge">安全姿态计算中</span></div>
      <div id="firstRun" class="first-run">
        <div class="section-title">DeepSeek API</div>
        <p>接入后由 DeepSeek 输出精简的「回答 + 情绪 + 必要动作」JSON。API Key 仅保存在本次运行内。</p>
        <input id="apiKey" type="password" autocomplete="off" placeholder="sk-...（可留空使用体验模式）" />
        <div class="row-buttons"><button id="saveApi">接入 DeepSeek</button><button id="useDemo">体验模式</button></div>
      </div>
      <div class="section-title">输入</div>
      <div class="input-row">
        <button id="micBtn" class="mic-btn" title="语音输入">🎙</button>
        <textarea id="inputBox" rows="2" placeholder="直接输入，或点击麦克风说话…"></textarea>
        <button id="sendBtn">发送</button>
      </div>
      <div id="queueInfo" class="queue-info">空闲</div>
      <div class="section-title">体验预设</div>
      <div id="presetGrid" class="preset-grid"></div>
      <div class="section-title">声音</div>
      <div class="voice-card">
        <div><b>默认：Qwen3-TTS Serena</b><small>本地语音包同时提供 Vosk 离线中文输入与 Qwen3-TTS 情感输出；不可用时自动回退系统能力。</small></div>
        <span id="voiceBadge">检测中</span>
      </div>
      <div class="section-title">运行状态</div>
      <div class="stats">
        <span>安全姿态库 <b id="bankCount">0</b></span>
        <span>路径预检 <b id="pathCount">0</b></span>
        <span>拒绝候选 <b id="rejectCount">0</b></span>
      </div>
      <p class="hint">双击模型可再次收起界面。运行中的回答不会被打断；新输入会排队，并从当前动作自然过渡。</p>
    </aside>
  </div>
  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/src/local-asr.mjs"></script>
  <script type="module" src="/src/model-hit-guard.mjs"></script>
</body>
</html>
