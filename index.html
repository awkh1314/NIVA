<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071012" />
  <title>NIVA · Free Life</title>
</head>
<body>
  <div id="app">
    <div id="stage" class="stage">
      <canvas id="nivaCanvas"></canvas>
      <div id="modelBootOverlay" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none;color:#8fdedc;font:14px/1.5 system-ui,sans-serif;background:radial-gradient(circle at center,#10212655 0,#0b0d0e00 42%);">
        <div style="padding:10px 14px;border:1px solid #285063;border-radius:12px;background:#07141bcc;backdrop-filter:blur(10px)">正在载入 NIVA 3D 模型…</div>
      </div>
      <div class="topbar">
        <span class="free-badge">FREE / 基础体验</span>
        <div class="top-actions">
          <button id="panelToggle" class="ghost-btn">控制台</button>
          <button id="upgradeToggle" class="ghost-btn">升级 / 接入</button>
        </div>
      </div>
      <div id="nivaBubbles" class="bubble-column niva-column"></div>
      <div id="userBubbles" class="bubble-column user-column"></div>
      <div class="experience-bar" id="experienceBar"></div>
      <div class="composer">
        <div class="composer-mode">
          <button data-mode="chat" class="mode-btn active">对话</button>
          <button data-mode="speak" class="mode-btn">发声</button>
        </div>
        <textarea id="composerInput" rows="1" placeholder="和 NIVA 说点什么……"></textarea>
        <button id="sendBtn" class="primary-btn">发送</button>
      </div>
      <div id="toast" class="toast hidden"></div>
    </div>
    <aside id="controlPanel" class="drawer hidden" aria-hidden="true">
      <div class="drawer-head">
        <div><b>NIVA 控制台</b><small id="runtimeSummary">Free Life Runtime</small></div>
        <button id="closePanel" class="icon-btn">×</button>
      </div>
      <nav id="controlTabs" class="tabs"></nav>
      <div id="controlPage" class="control-page"></div>
    </aside>
    <aside id="upgradePanel" class="upgrade-panel hidden" aria-hidden="true">
      <div class="drawer-head">
        <div><b>升级 / 接入</b><small>基础体验保持完全免费</small></div>
        <button id="closeUpgrade" class="icon-btn">×</button>
      </div>
      <div class="upgrade-grid">
        <section class="upgrade-card"><h3>Brain</h3><p>当前：Local Demo</p><label>Provider<select><option>Local Demo</option><option disabled>DeepSeek</option><option disabled>OpenAI-compatible</option></select></label><label>API Key<input type="password" placeholder="升级时再填写" disabled></label><small>免费版不会发起模型网络请求。</small></section>
        <section class="upgrade-card"><h3>Voice</h3><p>当前：System Speech</p><label>Voice<select><option>系统语音</option><option>Web Kokoro（手动）</option></select></label><small>系统语音是免费默认保底；高级语音包后续接入。</small></section>
        <section class="upgrade-card"><h3>Motion</h3><p>当前：NIVA Free Motion</p><button class="secondary-btn" disabled>导入 VRMA（预留）</button><small>动作扩展不会获得直接控制原始骨骼的权限。</small></section>
      </div>
    </aside>
  </div>
  <script type="module" src="/src/main.js"></script>
  <script>
    (() => {
      const overlay = document.getElementById('modelBootOverlay');
      const text = overlay?.firstElementChild;
      const started = performance.now();
      const timer = setInterval(() => {
        let ready = false;
        try { ready = Boolean(window.NIVA?.state?.().modelReady); } catch {}
        if (ready) {
          clearInterval(timer);
          if (overlay) overlay.style.display = 'none';
          return;
        }
        const elapsed = performance.now() - started;
        if (text && elapsed > 12000) text.textContent = 'NIVA.vrm 正在加载，模型约 15 MB，请稍候…';
        if (text && elapsed > 30000) text.textContent = '3D 模型载入超时。请强制刷新页面（Ctrl+F5）后重试。';
      }, 250);
    })();
  </script>
</body>
</html>
