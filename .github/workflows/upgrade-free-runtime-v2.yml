name: Upgrade NIVA Free Runtime V2
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/upgrade-free-runtime-v2.yml"]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Add advanced VRM controls
        run: python .github/scripts/add_vrm_advanced_controls.py
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit advanced controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git commit -m "feat(web): expose mesh and spring bone controls"
          git push origin HEAD:main
