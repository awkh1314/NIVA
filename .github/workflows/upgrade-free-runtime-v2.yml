name: Upgrade NIVA Free Runtime V2
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/upgrade-free-runtime-v2.yml"]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply runtime patch
        run: python .github/scripts/upgrade_free_runtime_v2.py
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit upgraded runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/style.css
          git commit -m "feat(web): natural pose full controls and layered motion demos"
          git push origin HEAD:main
