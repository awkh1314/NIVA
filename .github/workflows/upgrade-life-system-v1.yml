name: Upgrade NIVA Life System V1
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/upgrade-life-system-v1.yml"]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply life system V1
        run: python .github/scripts/upgrade_life_system_v1.py
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit life system V1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/style.css index.html docs/LIFE_SYSTEM_V1.md
          git rm .github/scripts/upgrade_life_system_v1.py .github/workflows/upgrade-life-system-v1.yml
          git commit -m "feat(life): add fatigue recovery locomotion crouch and guide"
          git push origin HEAD:main
