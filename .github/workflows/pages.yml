name: Deploy NIVA Web Preview
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply V0.85.1 runtime responsiveness repair
        run: node tools/apply-v0851-runtime-fix.mjs
      - name: Persist one-time runtime migration
        shell: bash
        run: |
          if ! git diff --quiet -- src/main.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main.js
            git commit -m "fix(v0.85.1): restore responsive motion and browser audio"
            git push origin HEAD:main
          fi
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Mark successful preview deployment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf "V0.85.1 Pages deploy succeeded\nsource_sha=%s\npage_url=%s\n" "$GITHUB_SHA" "${{ steps.deployment.outputs.page_url }}" > .github/PAGES_SUCCESS
          git add .github/PAGES_SUCCESS
          git commit -m "chore(ci): mark V0.85.1 Pages deployment success [skip ci]"
          git push origin HEAD:main
