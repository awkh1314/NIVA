name: Apply NIVA Biomechanics V3
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-biomechanics-v3.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Patch authored motion clips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/main.js')
          s = p.read_text(encoding='utf-8')

          def line_replace(prefix, replacement):
              global s
              pattern = rf"(?m)^\s*{re.escape(prefix)}.*$"
              s2, n = re.subn(pattern, replacement, s, count=1)
              if n != 1:
                  raise SystemExit(f'patch marker missing: {prefix}')
              s = s2

          # Wave: the arm itself is now placed by world-space IK outside the torso.
          # The clip only supplies a small wrist oscillation, avoiding the old upper-arm cross-body pose.
          line_replace("clips.set('wave'", "  clips.set('wave', makeClip('wave',2.05,{rightHand:[[0,0,0,0],[.42,-2,0,-4],[.62,-2,0,-4],[.82,-1,0,7],[1.04,-1,0,-7],[1.26,-1,0,7],[1.48,-1,0,-7],[1.70,-2,0,-3],[2.05,0,0,0]]}));")

          # Walk/run arms are removed from local-Euler clips. Physics Body V3 solves their world-space
          # forward/back counter-swing with elbow poles after AnimationMixer evaluation.
          line_replace("clips.set('walk'", "  clips.set('walk',makeClip('walk',1,{leftUpperLeg:f(legL),rightUpperLeg:f(legR),leftLowerLeg:f(kneeL),rightLowerLeg:f(kneeR),leftFoot:f(footL),rightFoot:f(footR),hips:walkTimes.map((t,i)=>[t,0,(i<4?1.4:-1.4),0]),chest:walkTimes.map((t,i)=>[t,0,(i<4?-1:1),0])}));")
          line_replace("clips.set('run'", "  clips.set('run',makeClip('run',.70,{leftUpperLeg:rf(runL),rightUpperLeg:rf(runR),leftLowerLeg:rf(rkL),rightLowerLeg:rf(rkR),leftFoot:rf(rfL),rightFoot:rf(rfR),spine:rt.map(t=>[t,4.5,0,0]),chest:rt.map((t,i)=>[t,1.2,(i<4?-1.5:1.5),0])}));")

          # Crouch: only a tiny bend seed remains in the authored clip. The actual squat depth and
          # knee bend come from pelvis lowering + two independent planted feet + pole-guided leg IK.
          line_replace("clips.set('crouch'", "  clips.set('crouch',makeClip('crouch',2,{spine:[[0,6,0,0],[2,6,0,0]],chest:[[0,3,0,0],[2,3,0,0]],leftUpperLeg:[[0,4,0,0],[2,4,0,0]],rightUpperLeg:[[0,4,0,0],[2,4,0,0]],leftLowerLeg:[[0,8,0,0],[2,8,0,0]],rightLowerLeg:[[0,8,0,0],[2,8,0,0]],leftFoot:[[0,-2,0,0],[2,-2,0,0]],rightFoot:[[0,-2,0,0],[2,-2,0,0]],head:[[0,-2,0,0],[2,-2,0,0]]}));")

          s = s.replace("window.NIVA={version:'0.94-physics-body'", "window.NIVA={version:'0.95-biomechanics-v3'", 1)
          p.write_text(s, encoding='utf-8')

          p = Path('package.json')
          t = p.read_text(encoding='utf-8')
          t = t.replace('"version": "0.94.0"', '"version": "0.95.0"', 1)
          p.write_text(t, encoding='utf-8')

          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          h = h.replace('NIVA 真实生命系统 · V2', 'NIVA 真实生命系统 · V3', 1)
          h = h.replace('这是 V2 的左右脚独立锁定。', '这是 V3 的左右脚独立锁定；进入蹲下前先锁住站立脚位，再降低骨盆，并用膝盖 pole vector 约束弯曲方向。', 1)
          p.write_text(h, encoding='utf-8')
          PY
      - name: Install
        run: npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit calibrated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js package.json package-lock.json index.html
          git commit -m "fix(motion): grounded crouch safe wave and physical arm swing"
          git push origin HEAD:main
