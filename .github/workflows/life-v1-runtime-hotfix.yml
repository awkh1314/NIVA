name: NIVA Life V1 Runtime Hotfix
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/life-v1-runtime-hotfix.yml"]
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fix crouch grounding and life timing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text(encoding='utf-8')
          old="if(currentAction && ['walk','run','wave','think','thinkLoop','reach','weight','nod'].includes(currentActionName) && !manualOffsets.has(name)) continue;"
          new="if(currentAction && ['walk','run','wave','think','thinkLoop','reach','weight','nod','crouch','recovery'].includes(currentActionName) && !manualOffsets.has(name)) continue;"
          assert old in s
          s=s.replace(old,new,1)
          old="chooseStageTarget(){const a=Math.random()*Math.PI*2,r=.32+Math.random()*.82;this.stageTarget.set(Math.cos(a)*r,0,Math.sin(a)*r);}"
          new="chooseStageTarget(){const a=Math.random()*Math.PI*2,scale=Math.max(.4,floor.scale.x||1),r=(.32+Math.random()*.82)*scale;this.stageTarget.set(Math.cos(a)*r,0,Math.sin(a)*r);}"
          assert old in s
          s=s.replace(old,new,1)
          old="const dir=to.normalize(),fatigueSlow=1-clamp((this.fatigue-35)/170,0,.28),speed=(a==='run'?.43:.20)*(settings.lifeTimeScale||1)*fatigueSlow;"
          new="const dir=to.normalize(),fatigueSlow=1-clamp((this.fatigue-35)/170,0,.28),speed=(a==='run'?.43:.20)*fatigueSlow;"
          assert old in s
          s=s.replace(old,new,1)
          old="pos.addScaledVector(dir,speed*dt);const maxR=1.18;if(pos.length()>maxR)pos.setLength(maxR);"
          new="pos.addScaledVector(dir,speed*dt);const maxR=1.18*Math.max(.4,floor.scale.x||1);if(pos.length()>maxR)pos.setLength(maxR);"
          assert old in s
          s=s.replace(old,new,1)
          old="if(!vrm?.expressionManager||speaking||activeExpression!=='neutral')return;const tired=clamp((this.fatigue-32)/115,0,.42);if(tired<=0)return;\n    try{vrm.expressionManager.setValue('relaxed',tired);}catch{}"
          new="if(!vrm?.expressionManager||speaking||activeExpression!=='neutral')return;const tired=clamp((this.fatigue-32)/115,0,.42);\n    try{vrm.expressionManager.setValue('relaxed',tired);}catch{}"
          assert old in s
          s=s.replace(old,new,1)
          old='<button data-preview="run">跑步</button></div>${rowSlider(\'动作速度\''
          new='<button data-preview="run">跑步</button><button data-preview="crouch">蹲下</button></div>${rowSlider(\'动作速度\''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git rm .github/workflows/life-v1-runtime-hotfix.yml
          git commit -m "fix(life): preserve crouch clips and stage-aware locomotion"
          git push origin HEAD:main
