name: Apply NIVA Body Physics V1
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/apply-body-physics-v1.yml"]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply body physics integration
        run: python .github/scripts/apply_body_physics_v1.py
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Commit physics runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js package-lock.json
          git rm -f .github/scripts/apply_body_physics_v1.py .github/workflows/apply-body-physics-v1.yml
          git commit -m "feat(physics): integrate Rapier movement foot IK and grounded crouch"
          git push origin HEAD:main
