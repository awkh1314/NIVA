name: Build NIVA Windows EXE
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install
      - name: Test planner and runtime safety
        run: npm test
      - name: Vendor Kokoro INT8 zf_001 for offline desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Model = "public\kokoro\model"
          $Onnx = "$Model\onnx"
          $Voices = "public\kokoro\voices"
          New-Item -ItemType Directory -Force -Path $Onnx,$Voices | Out-Null
          $ModelRevision = "8b6f9672edefb3e00d1a946d79bb702c02519389"
          $VoiceRevision = "52a9e4810fdb21f40c14c3ca21d19069beca31c3"
          $Repo = "https://huggingface.co/onnx-community/Kokoro-82M-v1.1-zh-ONNX/resolve"
          $ModelBase = "$Repo/$ModelRevision"
          $VoiceBase = "$Repo/$VoiceRevision"
          Invoke-WebRequest "$ModelBase/config.json?download=true" -OutFile "$Model\config.json"
          Invoke-WebRequest "$ModelBase/tokenizer.json?download=true" -OutFile "$Model\tokenizer.json"
          Invoke-WebRequest "$ModelBase/tokenizer_config.json?download=true" -OutFile "$Model\tokenizer_config.json"
          Invoke-WebRequest "$ModelBase/onnx/model_quantized.onnx?download=true" -OutFile "$Onnx\model_quantized.onnx"
          Invoke-WebRequest "$VoiceBase/voices/zf_001.bin?download=true" -OutFile "$Voices\zf_001.bin"
          $hash=(Get-FileHash "$Onnx\model_quantized.onnx" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "a39469be791eeaa3089c1ed5e58b8731d1f2462ea0e7dae2bc44388e58f973d8") { throw "Kokoro model SHA256 mismatch: $hash" }
          $voiceHash=(Get-FileHash "$Voices\zf_001.bin" -Algorithm SHA256).Hash.ToLower()
          if ($voiceHash -ne "0a89ec12bb93fb9c74077924daf02568baad64e1f869389f5aaee01a386035f8") { throw "Kokoro voice SHA256 mismatch: $voiceHash" }
      - name: Build portable EXE
        run: npm run desktop
      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\voice | Out-Null
          Copy-Item src-tauri\target\release\niva.exe release\NIVA.exe
          Copy-Item tools\voice\* release\voice\
          @"
          NIVA V0.99.0 Portable
          1. 直接运行 NIVA.exe；不配置 API 时可使用内置 Free Life Runtime。
          2. Brain / Voice / Motion 保持隔离边界，公开接口支持 NIVA.play({ text, emotion, motion })。
          3. Kokoro INT8 / zf_001 分别固定已验证上游 revision 与 SHA256，桌面包离线携带模型资源。
          4. Runtime Boundaries / Biomechanics V2 / Safe Pose / IK 测试必须全部通过后才产出包。
          "@ | Set-Content -Encoding UTF8 release\README.txt
          Compress-Archive -Path release\* -DestinationPath NIVA-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NIVA-Windows-x64
          path: NIVA-Windows-x64.zip
          retention-days: 30
      - name: Publish rolling prerelease
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.99-latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete v0.99-latest --yes --cleanup-tag
          }
          gh release create v0.99-latest NIVA-Windows-x64.zip --title "NIVA V0.99.0 Latest" --notes "Free Life Runtime + public Motion Bridge + Runtime Boundaries + Biomechanics V2 + pinned offline Kokoro zf_001."
