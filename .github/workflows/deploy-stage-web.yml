name: Deploy NIVA VRM Stage

on:
  push:
    branches:
      - feat/stage-web-vrm
    paths:
      - 'apps/stage-web/**'
      - 'NIVA.vrm'
      - '.github/workflows/deploy-stage-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/stage-web/package.json
      - name: Install dependencies
        working-directory: apps/stage-web
        run: npm install
      - name: Build NIVA VRM stage
        working-directory: apps/stage-web
        run: npm run build
      - name: Bundle NIVA VRM
        working-directory: apps/stage-web
        run: |
          if [ -f ../../NIVA.vrm ]; then cp ../../NIVA.vrm dist/NIVA.vrm; fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/stage-web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
