name: Deploy NIVA VRM Stage

on:
  push:
    branches:
      - feat/stage-web-vrm
    paths:
      - 'apps/stage-web/**'
      - 'NIVA.vrm'
      - '.github/workflows/deploy-stage-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/stage-web/package.json

      - name: Install dependencies
        working-directory: apps/stage-web
        run: npm install

      - name: Patch responsive VRM camera
        working-directory: apps/stage-web
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.ts')
          s = p.read_text()
          old = '''function fitCamera() {
            if (!modelRoot) return
            const box = new THREE.Box3().setFromObject(modelRoot), size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3())
            const h = Math.max(size.y, 1)
            camera.position.set(center.x, center.y + h * .02, center.z + h * 1.15)
            camera.lookAt(center.x, center.y + h * .02, center.z)
            camera.near = Math.max(.01, h / 100); camera.far = h * 20; camera.updateProjectionMatrix()
          }
          function resize() {
            const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / Math.max(r.height, 1); camera.updateProjectionMatrix()
          }'''
          new = '''function fitCamera() {
            if (!modelRoot) return
            modelRoot.updateWorldMatrix(true, true)
            const box = new THREE.Box3().setFromObject(modelRoot)
            const size = box.getSize(new THREE.Vector3())
            const center = box.getCenter(new THREE.Vector3())
            const h = Math.max(size.y, .01)
            const w = Math.max(size.x, .01)
            const vFov = THREE.MathUtils.degToRad(camera.fov)
            const aspect = Math.max(camera.aspect, .01)
            const hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect)
            const distanceForHeight = h / (2 * Math.tan(vFov / 2))
            const distanceForWidth = w / (2 * Math.tan(hFov / 2))
            const distance = Math.max(distanceForHeight, distanceForWidth) * 1.18
            const targetY = center.y
            camera.position.set(center.x, targetY, box.max.z + distance)
            camera.lookAt(center.x, targetY, center.z)
            camera.near = Math.max(.01, distance / 100)
            camera.far = Math.max(100, distance + h * 20)
            camera.updateProjectionMatrix()
          }
          function resize() {
            const r = stage.getBoundingClientRect()
            renderer.setSize(Math.max(1, r.width), Math.max(1, r.height), false)
            camera.aspect = Math.max(1, r.width) / Math.max(1, r.height)
            camera.updateProjectionMatrix()
            if (modelRoot) fitCamera()
          }'''
          if old not in s:
              raise SystemExit('camera block not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Build NIVA VRM stage
        working-directory: apps/stage-web
        run: npm run build

      - name: Bundle NIVA VRM
        working-directory: apps/stage-web
        run: cp ../../NIVA.vrm dist/NIVA.vrm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/stage-web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
