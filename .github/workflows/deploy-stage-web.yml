name: Deploy NIVA Stage Web Preview

on:
  push:
    branches:
      - feat/stage-web-vrm
    paths:
      - 'apps/stage-web/**'
      - '.github/workflows/deploy-stage-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/stage-web/package.json

      - name: Install dependencies
        working-directory: apps/stage-web
        run: npm install

      - name: Build stage-web
        working-directory: apps/stage-web
        run: npm run build

      - name: Rewrite runtime asset URLs for project Pages path
        working-directory: apps/stage-web
        run: |
          find dist -type f \( -name '*.js' -o -name '*.html' \) -print0 | xargs -0 sed -i \
            -e 's|/avatar/|/niva-digital-spirit/avatar/|g' \
            -e 's|/motions/|/niva-digital-spirit/motions/|g'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/stage-web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
