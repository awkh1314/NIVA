<style>
:root{--bg:#070b12;--panel:#0c111d;--panel2:#101827;--line:#1f3147;--cyan:#76e7f2;--violet:#b69aff;--text:#eef7ff;--muted:#8ea1b7;--ok:#8fffcf;--bad:#ff9ca8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 35% 0,#17233a 0,#080c14 40%,#05070b 100%);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(118,231,242,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(118,231,242,.035) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(to bottom,#000,transparent 75%)}a{color:inherit}.app{width:min(1440px,100%);margin:auto;padding:18px;display:grid;grid-template-columns:minmax(430px,1.05fr) minmax(430px,.95fr);gap:16px;min-height:100vh}.top{grid-column:1/-1;display:flex;align-items:center;gap:14px}.logo{font-size:28px;letter-spacing:.18em;font-weight:900}.logo span{font-weight:400;letter-spacing:.03em;color:var(--violet);margin-left:10px}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--cyan);text-decoration:none;background:rgba(13,22,35,.72)}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(13,19,31,.9),rgba(7,11,18,.88));border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.04)}.stage-card{position:sticky;top:14px;align-self:start;padding:18px}.stage-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.label{font-size:12px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}.status{font-size:12px;color:var(--ok);border:1px solid rgba(143,255,207,.22);border-radius:999px;padding:7px 10px;background:rgba(143,255,207,.06)}.canvas-shell{position:relative;display:grid;place-items:center;min-height:620px;border:1px solid rgba(118,231,242,.12);border-radius:20px;background:radial-gradient(circle at 50% 35%,rgba(74,132,170,.16),transparent 42%),#070b12;overflow:hidden}.canvas-shell:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(118,231,242,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(118,231,242,.045) 1px,transparent 1px);background-size:48px 48px;opacity:.7}canvas{position:relative;width:min(480px,86vw);height:auto;image-rendering:pixelated;image-rendering:crisp-edges}.speech{margin-top:12px;min-height:72px;border:1px solid rgba(118,231,242,.14);border-radius:16px;padding:12px 14px;background:rgba(5,9,15,.72);line-height:1.6}.speech b{display:block;color:var(--cyan);font-size:12px;letter-spacing:.12em;margin-bottom:4px}.panel{padding:18px;min-width:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section{margin-top:18px}.section h3{margin:0 0 10px;color:var(--violet);font-size:14px;letter-spacing:.15em;text-transform:uppercase}.controls{display:grid;gap:10px}.row{display:grid;grid-template-columns:132px minmax(0,1fr) 48px;gap:10px;align-items:center;color:var(--muted)}.row label{white-space:nowrap}.row output{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-align:right;color:#bdd9ef;font-size:12px}input[type=range]{width:100%;accent-color:var(--cyan)}select,input,textarea,button{font:inherit}select,textarea{width:100%;border:1px solid var(--line);background:#070b12;color:var(--text);border-radius:12px;padding:10px}button{border:1px solid rgba(118,231,242,.2);background:rgba(18,32,51,.82);color:var(--text);border-radius:12px;padding:10px 12px;cursor:pointer;transition:.14s}button:hover{transform:translateY(-1px);border-color:rgba(118,231,242,.55)}button.active{background:linear-gradient(135deg,rgba(118,231,242,.18),rgba(182,154,255,.2));border-color:rgba(182,154,255,.7)}.presets{display:flex;flex-wrap:wrap;gap:8px}.json{white-space:pre-wrap;overflow:auto;max-height:360px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:#05080d;color:#9cecff;padding:12px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.hint{color:var(--muted);font-size:13px;line-height:1.65;margin:8px 0 0}.chat{display:grid;gap:10px}.chat textarea{min-height:78px;resize:vertical}.chat-actions{display:flex;gap:8px;justify-content:flex-end}.small{font-size:12px;color:var(--muted)}.bad{color:var(--bad)}@media(max-width:980px){.app{grid-template-columns:1fr;padding:10px}.top{flex-wrap:wrap}.stage-card{position:relative;top:auto}.canvas-shell{min-height:520px}.row{grid-template-columns:112px minmax(0,1fr) 42px}.grid2{grid-template-columns:1fr}}

<body>
<main class="app">
  <header class="top"><div class="logo">NIVA <span>Control</span></div><a class="pill" href="./index.dev.html">← 原 2D 页面</a><a class="pill" href="./">主页</a><span class="pill">V0.7 Control Protocol MVP</span></header>
  <section class="card stage-card">
    <div class="stage-head"><div><div class="label">Debug Rig Renderer</div><div class="small">先验证身体控制数据，不追最终美术</div></div><div class="status" id="modeStatus">● MANUAL</div></div>
    <div class="canvas-shell"><canvas id="stage" width="320" height="420" aria-label="NIVA control debug rig"></canvas></div>
    <div class="speech"><b id="speaker">NIVA</b><span id="line">拖动右侧控制项，观察眼睛、嘴巴、头部、躯干和四肢如何被数据控制。</span></div>
  </section>
  <aside class="card panel">
    <div class="section" style="margin-top:0"><h3>Persona Demo</h3><div class="presets" id="personas"></div><p class="hint">同一句话由不同人格输出不同 Control JSON。这里是离线 Demo，不需要 API Key。</p></div>
    <div class="section chat"><h3>Offline Director</h3><textarea id="message">你这次表现不错啊。</textarea><div class="chat-actions"><button id="sample">测试句</button><button id="runDemo">生成控制数据</button></div></div>
    <div class="section"><h3>Presets</h3><div class="presets" id="presets"></div></div>
    <div id="panel"></div>
    <div class="section"><h3>Current Control JSON</h3><pre class="json" id="json"></pre></div>
  </aside>
</main>
<script>
'use strict';
const clamp=(v,min,max)=>Math.max(min,Math.min(max,Number.isFinite(+v)?+v:min));
const lerp=(a,b,t)=>a+(b-a)*t;
const deepCopy=o=>JSON.parse(JSON.stringify(o));
const defaults={face:{eyeOpen:.85,gazeX:0,gazeY:0,browRaise:0,mouthOpen:0,mouthSmile:.1,blush:0},head:{yaw:0,pitch:0,tilt:0},torso:{bodyLean:0,chestLift:.2,waistTwist:0,breath:.35},arms:{leftArmPose:'relaxed',rightArmPose:'relaxed',leftHandOpen:.55,rightHandOpen:.55},legs:{stance:'balanced',weightShift:0},emotion:{mood:'neutral',intensity:.4}};
const ranges=[['face','eyeOpen',0,1,.01],['face','gazeX',-1,1,.01],['face','gazeY',-1,1,.01],['face','browRaise',-1,1,.01],['face','mouthOpen',0,1,.01],['face','mouthSmile',-1,1,.01],['face','blush',0,1,.01],['head','yaw',-1,1,.01],['head','pitch',-1,1,.01],['head','tilt',-1,1,.01],['torso','bodyLean',-1,1,.01],['torso','chestLift',0,1,.01],['torso','waistTwist',-1,1,.01],['torso','breath',0,1,.01],['arms','leftHandOpen',0,1,.01],['arms','rightHandOpen',0,1,.01],['legs','weightShift',-1,1,.01],['emotion','intensity',0,1,.01]];
const selects={arms:{leftArmPose:['relaxed','raise','present','behind','cross'],rightArmPose:['relaxed','raise','present','behind','cross']},legs:{stance:['idle','balanced','stepLeft','stepRight']},emotion:{mood:['neutral','happy','thinking','proud','calm','annoyed','shy']}};
const presets={Neutral:defaults,Happy:{face:{eyeOpen:.95,gazeX:0,gazeY:0,browRaise:.25,mouthOpen:.26,mouthSmile:.78,blush:.12},head:{yaw:0,pitch:-.04,tilt:.05},torso:{bodyLean:.18,chestLift:.38,waistTwist:.08,breath:.55},arms:{leftArmPose:'relaxed',rightArmPose:'present',leftHandOpen:.75,rightHandOpen:1},legs:{stance:'balanced',weightShift:.12},emotion:{mood:'happy',intensity:.82}},Thinking:{face:{eyeOpen:.58,gazeX:-.32,gazeY:-.18,browRaise:.16,mouthOpen:.02,mouthSmile:0,blush:0},head:{yaw:-.16,pitch:.08,tilt:.18},torso:{bodyLean:.02,chestLift:.18,waistTwist:-.05,breath:.28},arms:{leftArmPose:'relaxed',rightArmPose:'raise',leftHandOpen:.45,rightHandOpen:.35},legs:{stance:'balanced',weightShift:-.04},emotion:{mood:'thinking',intensity:.55}},Proud:{face:{eyeOpen:.64,gazeX:.34,gazeY:-.12,browRaise:.36,mouthOpen:.03,mouthSmile:.32,blush:0},head:{yaw:.18,pitch:-.22,tilt:0},torso:{bodyLean:-.08,chestLift:.55,waistTwist:.08,breath:.32},arms:{leftArmPose:'behind',rightArmPose:'behind',leftHandOpen:.35,rightHandOpen:.35},legs:{stance:'balanced',weightShift:.14},emotion:{mood:'proud',intensity:.72}},Calm:{face:{eyeOpen:.74,gazeX:0,gazeY:0,browRaise:0,mouthOpen:0,mouthSmile:.08,blush:0},head:{yaw:0,pitch:0,tilt:0},torso:{bodyLean:0,chestLift:.22,waistTwist:0,breath:.22},arms:{leftArmPose:'relaxed',rightArmPose:'relaxed',leftHandOpen:.45,rightHandOpen:.45},legs:{stance:'balanced',weightShift:0},emotion:{mood:'calm',intensity:.38}},Reset:defaults};
let target=deepCopy(defaults), current=deepCopy(defaults), persona='smug', typingTimer=null;
const $=id=>document.getElementById(id), canvas=$('stage'), ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
function normalize(s){s=merge(defaults,s);for(const [g,k,min,max] of ranges)s[g][k]=clamp(s[g][k],min,max);for(const g in selects){for(const k in selects[g]){if(!selects[g][k].includes(s[g][k]))s[g][k]=defaults[g][k];}}const l=s.arms.leftArmPose,r=s.arms.rightArmPose;if(l==='cross'||r==='cross'){s.arms.leftArmPose='cross';s.arms.rightArmPose='cross';}else if(l==='behind'||r==='behind'){s.arms.leftArmPose='behind';s.arms.rightArmPose='behind';}else if(l==='present'&&r==='present')s.arms.leftArmPose='relaxed';else if(l==='raise'&&r==='raise')s.arms.leftArmPose='relaxed';return s;}
function merge(a,b){const o=deepCopy(a);for(const g in b||{}){if(typeof b[g]==='object'&&!Array.isArray(b[g]))o[g]={...(o[g]||{}),...b[g]};}return o;}
function apply(next,instant=false){target=normalize(next);if(instant)current=deepCopy(target);syncPanel();renderJson();}
function tween(){for(const g in current){for(const k in current[g]){if(typeof current[g][k]==='number')current[g][k]=lerp(current[g][k],target[g][k],.18);else current[g][k]=target[g][k];}}}
function buildPanel(){const panel=$('panel');const groups=['face','head','torso','arms','legs','emotion'];for(const g of groups){const sec=document.createElement('div');sec.className='section';sec.innerHTML=`<h3>${g}</h3><div class="controls"></div>`;const box=sec.querySelector('.controls');for(const [gg,k,min,max,step] of ranges.filter(r=>r[0]===g)){const row=document.createElement('div');row.className='row';row.innerHTML=`<label>${k}</label><input type="range" min="${min}" max="${max}" step="${step}" data-g="${g}" data-k="${k}"><output></output>`;box.appendChild(row);}if(selects[g])for(const k in selects[g]){const row=document.createElement('div');row.className='row';row.innerHTML=`<label>${k}</label><select data-g="${g}" data-k="${k}">${selects[g][k].map(v=>`<option>${v}</option>`).join('')}</select><output></output>`;box.appendChild(row);}panel.appendChild(sec);}panel.addEventListener('input',e=>{const el=e.target;if(!el.dataset.g)return;const g=el.dataset.g,k=el.dataset.k;target=deepCopy(target);target[g][k]=el.type==='range'?+el.value:el.value;apply(target);$('modeStatus').textContent='● MANUAL';});}
function syncPanel(){document.querySelectorAll('[data-g]').forEach(el=>{const v=target[el.dataset.g][el.dataset.k];if(el.type==='range')el.value=v;else el.value=v;const out=el.parentElement.querySelector('output');if(out)out.textContent=typeof v==='number'?v.toFixed(2):v;});}
function renderJson(){$('json').textContent=JSON.stringify(target,null,2);}
function buildButtons(){const p=$('presets');Object.keys(presets).forEach(name=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>{apply(presets[name]);speak('NIVA',`已切换到 ${name} 控制预设。`);$('modeStatus').textContent='● PRESET'};p.appendChild(b);});const ps=$('personas');[{id:'smug',name:'装杯型'},{id:'bubbly',name:'活泼型'},{id:'calm',name:'冷静型'}].forEach(x=>{const b=document.createElement('button');b.textContent=x.name;b.onclick=()=>{persona=x.id;[...ps.children].forEach(n=>n.classList.toggle('active',n===b));};ps.appendChild(b);if(x.id===persona)b.classList.add('active');});}
function speak(who,text){$('speaker').textContent=who;const line=$('line');clearInterval(typingTimer);line.textContent='';let i=0;typingTimer=setInterval(()=>{line.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(typingTimer)},28);}
function director(text){const base=text.includes('表现不错')?true:false;if(persona==='bubbly')return{text:base?'欸？你也发现啦！我今天状态超好！':`收到！这件事听起来很有意思。`,control:presets.Happy};if(persona==='calm')return{text:base?'谢谢。结果符合预期，我们继续。':`知道了。我会认真处理这个问题。`,control:presets.Calm};return{text:base?'表现不错？这种程度，不值得特意提。':`这点事也要问？我当然知道。`,control:presets.Proud};}
function draw(){requestAnimationFrame(draw);tween();drawRig(current,performance.now()/1000);}
function pixelRect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function limb(a,b,w,c){ctx.save();ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(Math.round(a.x),Math.round(a.y));ctx.lineTo(Math.round(b.x),Math.round(b.y));ctx.stroke();ctx.restore();}
function drawRig(s,t){ctx.clearRect(0,0,320,420);ctx.save();ctx.translate(160,220);const intensity=s.emotion.intensity;const mood=s.emotion.mood;const breathe=Math.sin(t*3.2)*s.torso.breath;const lean=s.torso.bodyLean*14;const twist=s.torso.waistTwist*10;const weight=s.legs.weightShift*16;const step=s.legs.stance==='stepLeft'?-10:s.legs.stance==='stepRight'?10:0;ctx.translate(weight,0);ctx.rotate((s.head.tilt*.03)+(lean*.001));drawStage();const skin='#f6d7cf',skin2='#ffdcd6',outline='#234267',body='#eaf7ff',shade='#bad4ec',cyan='#74edf6',blue='#386cc5',hair='#376fc6',hair2='#2b55a4',shadow='#15243a';const pelvis={x:0,y:88},chest={x:twist*.35+lean*.25,y:12-breathe-s.torso.chestLift*4},neck={x:chest.x+s.head.yaw*4,y:-38+s.head.pitch*3};const head={x:neck.x+s.head.yaw*10,y:neck.y-35+s.head.pitch*9};const shoulderL={x:chest.x-39,y:chest.y-24},shoulderR={x:chest.x+39,y:chest.y-24};const hipL={x:pelvis.x-21,y:pelvis.y},hipR={x:pelvis.x+21,y:pelvis.y};const kneeL={x:-20+Math.min(step,0),y:150},kneeR={x:20+Math.max(step,0),y:150};const ankleL={x:-22+Math.min(step,0),y:213},ankleR={x:22+Math.max(step,0),y:213};const arms=armPoints(s,shoulderL,shoulderR,chest);ctx.globalAlpha=.5;if(s.arms.leftArmPose==='behind'||s.arms.leftArmPose==='cross')drawArm(arms.L,10,shadow,skin);if(s.arms.rightArmPose==='behind'||s.arms.rightArmPose==='cross')drawArm(arms.R,10,shadow,skin);ctx.globalAlpha=1;drawHairBack(head,hair2);drawLeg(hipL,kneeL,ankleL,11,body,shade,cyan);drawLeg(hipR,kneeR,ankleR,11,body,shade,cyan);drawTorso(chest,pelvis,body,shade,cyan);if(!(s.arms.leftArmPose==='behind'||s.arms.leftArmPose==='cross'))drawArm(arms.L,12,body,skin);if(!(s.arms.rightArmPose==='behind'||s.arms.rightArmPose==='cross'))drawArm(arms.R,12,body,skin);if(s.arms.leftArmPose==='cross'||s.arms.rightArmPose==='cross')drawCrossArms(chest,body,skin);drawHead(head,s,hair,skin,skin2,cyan,blue,mood,intensity);ctx.restore();}
function drawStage(){ctx.save();ctx.translate(0,210);ctx.fillStyle='rgba(118,231,242,.14)';ctx.fillRect(-86,0,172,2);ctx.fillStyle='rgba(118,231,242,.06)';ctx.fillRect(-66,4,132,6);ctx.restore();}
function drawLeg(h,k,a,w,body,shade,cyan){limb(h,k,w,shade);limb(k,a,w,body);pixelRect(a.x-13,a.y-3,26,10,'#213c6c');pixelRect(a.x-5,a.y-9,18,8,cyan);}
function drawTorso(ch,p,body,shade,cyan){ctx.fillStyle='#1a2a44';ctx.beginPath();ctx.moveTo(ch.x-45,ch.y-33);ctx.lineTo(ch.x+45,ch.y-33);ctx.lineTo(p.x+34,p.y+10);ctx.lineTo(p.x-34,p.y+10);ctx.closePath();ctx.fill();ctx.fillStyle=body;ctx.beginPath();ctx.moveTo(ch.x-36,ch.y-25);ctx.lineTo(ch.x+36,ch.y-25);ctx.lineTo(p.x+26,p.y+2);ctx.lineTo(p.x-26,p.y+2);ctx.closePath();ctx.fill();ctx.fillStyle=shade;for(let x=-22;x<=22;x+=11)pixelRect(p.x+x,p.y-45,6,45,shade);pixelRect(ch.x-3,ch.y-26,4,74,cyan);pixelRect(ch.x-42,ch.y-22,8,8,cyan);pixelRect(ch.x+35,ch.y-22,8,8,cyan);}
function armPoints(s,L,R,ch){function pts(side,pose){const sign=side==='L'?-1:1;const sh=side==='L'?L:R;if(pose==='present')return[{x:sh.x,y:sh.y},{x:sh.x+sign*42,y:sh.y+14},{x:sh.x+sign*72,y:sh.y+5}];if(pose==='raise')return[{x:sh.x,y:sh.y},{x:sh.x+sign*28,y:sh.y-36},{x:sh.x+sign*52,y:sh.y-58}];if(pose==='behind')return[{x:sh.x,y:sh.y},{x:ch.x+sign*18,y:ch.y+38},{x:ch.x+sign*10,y:ch.y+72}];if(pose==='cross')return[{x:sh.x,y:sh.y},{x:ch.x-sign*10,y:ch.y+12},{x:ch.x-sign*28,y:ch.y+24}];return[{x:sh.x,y:sh.y},{x:sh.x+sign*18,y:sh.y+50},{x:sh.x+sign*14,y:sh.y+92}];}return{L:pts('L',s.arms.leftArmPose),R:pts('R',s.arms.rightArmPose)}}
function drawArm(p,w,cloth,skin){limb(p[0],p[1],w,cloth);limb(p[1],p[2],w,cloth);pixelRect(p[2].x-7,p[2].y-3,14,12,skin);}
function drawCrossArms(ch,cloth,skin){limb({x:ch.x-38,y:ch.y-14},{x:ch.x+28,y:ch.y+20},12,cloth);limb({x:ch.x+38,y:ch.y-14},{x:ch.x-28,y:ch.y+20},12,cloth);pixelRect(ch.x+22,ch.y+15,12,9,skin);pixelRect(ch.x-34,ch.y+15,12,9,skin);}
function drawHairBack(h,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(h.x-54,h.y-18);ctx.lineTo(h.x+54,h.y-18);ctx.lineTo(h.x+65,h.y+105);ctx.lineTo(h.x+36,h.y+135);ctx.lineTo(h.x+22,h.y+30);ctx.lineTo(h.x-22,h.y+30);ctx.lineTo(h.x-36,h.y+135);ctx.lineTo(h.x-65,h.y+105);ctx.closePath();ctx.fill();}
function drawHead(h,s,hair,skin,skin2,cyan,blue,mood,intensity){ctx.save();ctx.translate(h.x,h.y);ctx.rotate(s.head.tilt*.16);ctx.fillStyle=hair;ctx.beginPath();ctx.moveTo(-46,-37);ctx.lineTo(36,-43);ctx.lineTo(55,-16);ctx.lineTo(52,24);ctx.lineTo(35,46);ctx.lineTo(-36,47);ctx.lineTo(-54,19);ctx.lineTo(-52,-12);ctx.closePath();ctx.fill();ctx.fillStyle=skin;ctx.beginPath();ctx.moveTo(-32,-14);ctx.lineTo(32,-14);ctx.lineTo(36,18);ctx.lineTo(22,43);ctx.lineTo(-22,43);ctx.lineTo(-36,18);ctx.closePath();ctx.fill();ctx.fillStyle=skin2;pixelRect(-18,24,36,13,skin2);ctx.fillStyle=hair;pixelRect(-50,-19,26,92,hair);pixelRect(25,-17,25,94,hair);pixelRect(-24,-32,44,21,hair);pixelRect(-8,-46,13,14,hair);ctx.strokeStyle=cyan;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(38,-33,18,7,-.45,0,Math.PI*2);ctx.stroke();pixelRect(34,-36,6,6,cyan);drawFace(s,mood,intensity);ctx.restore();}
function drawFace(s,mood,intensity){const eyeH=Math.max(1,Math.round(8*s.face.eyeOpen));const gx=s.face.gazeX*5,gy=s.face.gazeY*3;const brow=s.face.browRaise*7;ctx.fillStyle='#f39aaa';if(s.face.blush>0){ctx.globalAlpha=s.face.blush*.55;pixelRect(-30,12,9,4,'#ff93b4');pixelRect(21,12,9,4,'#ff93b4');ctx.globalAlpha=1;}ctx.fillStyle='#1b3153';pixelRect(-27,-2,19,eyeH,'#e8fbff');pixelRect(8,-2,19,eyeH,'#e8fbff');pixelRect(-20+gx,-1+gy,6,Math.max(1,eyeH),'#244fa4');pixelRect(15+gx,-1+gy,6,Math.max(1,eyeH),'#244fa4');ctx.fillStyle='#173052';pixelRect(-29,-9-brow,23,3,'#173052');pixelRect(6,-9-brow,23,3,'#173052');const smile=s.face.mouthSmile, open=s.face.mouthOpen;ctx.fillStyle=smile>=0?'#8e455c':'#653549';const mw=14+Math.abs(smile)*8,mh=2+open*14;pixelRect(-mw/2,24,mw,mh,ctx.fillStyle);if(smile>.2){pixelRect(-mw/2-3,22,4,3,'#8e455c');pixelRect(mw/2-1,22,4,3,'#8e455c');}if(smile<-.15){pixelRect(-mw/2-3,28,4,3,'#653549');pixelRect(mw/2-1,28,4,3,'#653549');}}
